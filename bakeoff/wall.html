* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 1px;
  height: 100dvh;
  background: var(--void);
}
.cell { position: relative; overflow: hidden; background: var(--cell); }
.pane {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(233, 231, 226, 0.22) transparent;
}
.pane::-webkit-scrollbar { width: 9px; }
.pane::-webkit-scrollbar-thumb {
  background: rgba(233, 231, 226, 0.2);
  border-radius: 9px;
  border: 3px solid transparent;
  background-clip: content-box;
}
.shot {
  width: 100%;
  background-size: 100% auto;
  background-repeat: no-repeat;
  background-position: top center;
}

.cell-d .shot { background-image: var(--d-d); aspect-ratio: 1440/2730; }
.cell-d .t-mob:checked ~ .pane .shot { background-image: var(--d-m); aspect-ratio: 390/3342; }
.cell-d .t-base:checked ~ .pane .shot { background-image: var(--base-d); aspect-ratio: 1440/2630; }
.cell-d .t-base:checked ~ .t-mob:checked ~ .pane .shot { background-image: var(--base-m); aspect-ratio: 390/2486; }

.cell-c .shot { background-image: var(--c-d); aspect-ratio: 1440/3308; }
